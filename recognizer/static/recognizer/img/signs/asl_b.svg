  <!-- Skeleton Bones -->
  <g filter="url(#neonGlow)">
    <line x1="147.2" y1="210.0" x2="169.4" y2="197.0" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" />
