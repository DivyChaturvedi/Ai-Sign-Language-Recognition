<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="boneGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="320" rx="20" fill="url(#bgGrad)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1.5" />
  
  <!-- Subtle circular grid radar -->
  <circle cx="160.0" cy="122.5" r="110" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
  <circle cx="160.0" cy="122.5" r="70" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />

  <!-- Watermark Letter -->
  <text x="160.0" y="172.5" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="140" font-weight="900" fill="rgba(255, 255, 255, 0.03)" letter-spacing="-2">B</text>

  <!-- Language Badge -->
  <g transform="translate(18, 16)">
    <rect width="52" height="22" rx="6" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1"/>
    <text x="26" y="15" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="800" fill="#818cf8">ASL</text>
  </g>

  <!-- Hands Tag -->
  <g transform="translate(240, 16)">
    <rect width="62" height="22" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>
    <text x="31" y="15" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="#38bdf8">1 HAND</text>
  </g>

  <!-- Palm Silhouette -->
