    <line x1="139.9" y1="83.8" x2="141.2" y2="68.2" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="178.5" y1="121.4" x2="163.9" y2="115.9" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" />
