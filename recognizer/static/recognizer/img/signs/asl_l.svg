<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1e38" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="320" height="320" rx="20" fill="url(#bgGrad)" stroke="rgba(99, 102, 241, 0.28)" stroke-width="1.5" />
  
  <!-- Radar circles -->
  <circle cx="160" cy="130" r="85" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
  <circle cx="160" cy="130" r="55" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />

  <!-- Watermark Letter -->
  <text x="160" y="180" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="140" font-weight="900" fill="rgba(255, 255, 255, 0.03)" letter-spacing="-2">L</text>

  <!-- Language Badge -->
  <g transform="translate(18, 16)">
    <rect width="56" height="24" rx="6" fill="rgba(99, 102, 241, 0.18)" stroke="#6366f1" stroke-width="1"/>
    <text x="28" y="16" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="800" fill="#818cf8">ASL</text>
  </g>

  <!-- Hands Tag -->
  <g transform="translate(236, 16)">
    <rect width="66" height="24" rx="6" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
    <text x="33" y="16" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="#c084fc">1 HAND</text>
  </g>

  <!-- Hand Centerpiece -->
  <g transform="translate(160, 130)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="54" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1.5" />
    <text x="0" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#a5b4fc">L</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(0, 245)">
    <rect x="16" y="0" width="288" height="60" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <text x="160" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#f8fafc">Letter L</text>
    <text x="160" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Index finger upright, thumb extended 90 ...</text>
  </g>
</svg>