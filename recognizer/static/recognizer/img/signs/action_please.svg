      <stop offset="100%" stop-color="#0f2430" />
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="20" fill="url(#bgGrad)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.5" />
  <circle cx="160" cy="135" r="96" fill="none" stroke="rgba(6, 182, 212, 0.12)" stroke-width="1.5" stroke-dasharray="6 6">
    <animateTransform attributeName="transform" type="rotate" from="0 160 135" to="360 160 135" dur="14s" repeatCount="indefinite" />
  </circle>
  <g transform="translate(18, 16)">
