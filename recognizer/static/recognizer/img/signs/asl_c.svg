  <!-- Skeleton Bones -->
  <g filter="url(#neonGlow)">
    <line x1="81.5" y1="196.1" x2="131.5" y2="210.0" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" />
