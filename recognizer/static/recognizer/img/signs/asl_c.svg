    <line x1="203.0" y1="46.0" x2="216.3" y2="69.7" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="164.7" y1="104.6" x2="159.4" y2="88.9" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" />
