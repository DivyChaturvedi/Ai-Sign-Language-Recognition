    <rect width="288" height="38" rx="10" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <circle cx="22" cy="19" r="12" fill="linear-gradient(135deg, #6366f1, #06b6d4)" />
    <text x="22" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff">C</text>
    <text x="44" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">Letter C</text>
