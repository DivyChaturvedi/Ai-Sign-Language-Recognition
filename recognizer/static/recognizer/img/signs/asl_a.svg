  <circle cx="147.2" cy="95.8" r="6" fill="#ffffff" stroke="#06b6d4" stroke-width="2.5" />
  <circle cx="113.1" cy="70.4" r="3.5" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5" />
  <circle cx="119.1" cy="35.7" r="3.5" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5" />
  <circle cx="120.3" cy="89.6" r="3.5" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5" />
  <circle cx="122.2" cy="95.4" r="6" fill="#ffffff" stroke="#06b6d4" stroke-width="2.5" />
  <circle cx="82.5" cy="70.0" r="3.5" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5" />
  <circle cx="87.6" cy="52.9" r="3.5" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5" />
  <circle cx="92.6" cy="90.6" r="3.5" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5" />
  <circle cx="97.1" cy="94.8" r="6" fill="#ffffff" stroke="#06b6d4" stroke-width="2.5" />

  <!-- Bottom Info Banner -->
  <g transform="translate(16, 266)">
    <rect width="288" height="38" rx="10" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <circle cx="22" cy="19" r="12" fill="linear-gradient(135deg, #6366f1, #06b6d4)" />
    <text x="22" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff">A</text>
    <text x="44" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">Letter A</text>
    <text x="44" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8">Fist with thumb vertical along index</text>
