    <line x1="147.4" y1="91.6" x2="147.2" y2="95.8" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="99.0" y1="210.0" x2="113.1" y2="70.4" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="113.1" y1="70.4" x2="119.1" y2="35.7" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" />
