    <line x1="120.3" y1="89.6" x2="122.2" y2="95.4" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="99.0" y1="210.0" x2="82.5" y2="70.0" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="82.5" y1="70.0" x2="87.6" y2="52.9" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="87.6" y1="52.9" x2="92.6" y2="90.6" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="92.6" y1="90.6" x2="97.1" y2="94.8" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="176.5" y1="84.0" x2="143.4" y2="72.2" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="143.4" y1="72.2" x2="113.1" y2="70.4" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="113.1" y1="70.4" x2="82.5" y2="70.0" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" />
  </g>
  <!-- Joint Nodes -->
  <circle cx="99.0" cy="210.0" r="6.5" fill="#a855f7" stroke="#ffffff" stroke-width="2" />
  <circle cx="151.3" cy="206.0" r="3.5" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5" />
