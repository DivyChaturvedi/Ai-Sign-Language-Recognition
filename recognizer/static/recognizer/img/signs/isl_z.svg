<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#131d2e" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="320" height="320" rx="20" fill="url(#bgGrad)" stroke="rgba(16, 185, 129, 0.28)" stroke-width="1.5" />
  
  <!-- Subtle circular radar rings -->
  <circle cx="160" cy="130" r="85" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
  <circle cx="160" cy="130" r="55" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />

  <!-- Watermark Letter -->
  <text x="160" y="180" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="140" font-weight="900" fill="rgba(255, 255, 255, 0.03)" letter-spacing="-2">Z</text>

  <!-- Language Badge -->
  <g transform="translate(18, 16)">
    <rect width="64" height="24" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="32" y="16" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="800" fill="#10b981">ISL 🇮🇳</text>
  </g>

  <!-- Hands Tag -->
  <g transform="translate(230, 16)">
    <rect width="72" height="24" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1"/>
    <text x="36" y="16" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="#38bdf8">2 HANDS</text>
  </g>

  <!-- Main Hand Gesture Illustration Scaled Up -->
  <g transform="translate(160, 130) scale(2.0)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="34" fill="rgba(6, 182, 212, 0.06)" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1" />

        <!-- Standard two-hand touch -->
        <line x1="-16" y1="0" x2="16" y2="0" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
        <circle cx="-16" cy="0" r="4" fill="#a855f7"/>
        <circle cx="16" cy="0" r="4" fill="#06b6d4"/>
        <circle cx="0" cy="0" r="5" fill="#fff" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(0, 245)">
    <rect x="16" y="0" width="288" height="60" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <text x="160" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#f8fafc">Z Zigzag</text>
    <text x="160" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Right index traces 'Z' zigzag across ope...</text>
  </g>
</svg>