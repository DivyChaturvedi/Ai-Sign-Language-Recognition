{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>SignTalk Mobile Camera • {{ session_id }}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'recognizer/img/favicon.svg' %}">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background: #070b14;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .mobile-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.92);
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      z-index: 10;
    }
    .brand-mini {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .session-tag {
      font-family: monospace;
      font-size: 0.75rem;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(99, 102, 241, 0.35);
    }
    .status-pill {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .status-pill.ready {
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.35);
    }
    .status-pill.error {
      background: rgba(239, 68, 68, 0.16);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.35);
    }
    .cam-stage {
      position: relative;
      flex: 1;
      background: #000;
      overflow: hidden;
    }
    .cam-stage video,
    .cam-stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cam-stage.mirrored video,
    .cam-stage.mirrored canvas {
      transform: scaleX(-1);
    }
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.94);
      border-top: 1px solid rgba(148, 163, 184, 0.16);
      z-index: 10;
    }
    .detected-pill {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 600;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .flip-btn {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }
    .flip-btn:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="mobile-shell" data-session-id="{{ session_id }}">
    <header class="top-bar">
      <div class="brand-mini">
        <span>📱 SignTalk Cam</span>
        <span class="session-tag">{{ session_id }}</span>
      </div>
      <span id="mobileStatusPill" class="status-pill">Starting...</span>
    </header>

    <div id="mobileCamStage" class="cam-stage">
      <video id="mobileVideo" autoplay playsinline muted></video>
      <canvas id="mobileCanvas"></canvas>
    </div>

    <footer class="bottom-bar">
      <div id="mobileDetectedPill" class="detected-pill">Show hand in camera…</div>
      <button id="btnFlipCamera" class="flip-btn" type="button">🔄 Flip</button>
    </footer>
  </div>

  <script type="module" src="{% static 'recognizer/mobile_app.js' %}?v=1.1"></script>
</body>
</html>
